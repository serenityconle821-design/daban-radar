name: Cloud Premarket Thermometer Fallback

on:
  schedule:
    # Mon-Fri 08:55 CST (00:55 UTC): only updates if local 08:45 pipeline has not pushed today
    - cron: '55 0 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force refresh even if local snapshot exists today'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daban-cloud-premarket
  cancel-in-progress: false

jobs:
  premarket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --no-cache-dir requests

      - name: Run cloud premarket fallback
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scripts/cloud_premarket.py --force
          else
            python scripts/cloud_premarket.py
          fi

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add premarket_data.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(cloud): premarket thermometer fallback"
            git pull --rebase origin main || true
            git push
          fi
