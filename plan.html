<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>操作策略 · 观澜擒龙</title>
<!-- v1.16.1 详细操作策略页: 候选卡/精华卡点击进入 (?code=XXXXXX)
     内容: 今日判定(梯队/仓位/淘汰) + 盘中直答(实时行情) + 四步执行计划 + 因子明细 + 回测证据
     数据: data.js(SITE_DATA) + 腾讯JSONP实时行情; 登记与主站共享 localStorage(glql_daban_v115)
     [v1.16.9] 隔夜单改挂「昨收+5%」限价: 不用盯竞价 · 9:30未成交(=高开>5%)撤单; 死亡区间仅适用盘中排队 -->
<style>
:root {
  --bg: rgba(116,116,128,.12); --card: rgba(255,255,255,.36); --card2: rgba(255,255,255,.32);
  --primary: #007AFF; --primary-soft: rgba(0,122,255,.08);
  --text: #1D1D1F; --secondary: #6E6E73; --tertiary: #929298;
  --green: #34C759; --green-soft: rgba(52,199,89,.10);
  --red: #FF3B30; --red-soft: rgba(255,59,48,.08);
  --orange: #FF9500; --orange-soft: rgba(255,149,0,.10);
  --gray-badge: #8E8E93; --sep: rgba(60,60,67,.10);
  --radius: 16px;
  --glass-card: rgba(255,255,255,.22);
  --glass-nav: rgba(255,255,255,.55);
  --specular-top: rgba(255,255,255,.92);
  --specular-bottom: rgba(174,196,255,.20);
  --hairline: rgba(15,23,42,.10);
  --hairline-soft: rgba(15,23,42,.05);
  --tint-ink: 15,23,42; --tint-sky: 56,96,190;
  --blur-nav: saturate(180%) blur(24px);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  background:#F2F2F7; color:var(--text);
  font:17px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before {
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(64% 54% at 18% 8%,  rgba(158,180,255,.75) 0%, transparent 64%),
    radial-gradient(54% 50% at 92% 12%, rgba(186,210,255,.68) 0%, transparent 62%),
    radial-gradient(60% 56% at 78% 88%, rgba(218,196,250,.60) 0%, transparent 64%),
    radial-gradient(50% 44% at 8% 92%, rgba(190,224,252,.58) 0%, transparent 62%),
    linear-gradient(180deg, #F5F6FA 0%, #EDF0F5 100%);
}
.page { max-width:760px; margin:0 auto; padding:0 16px 70px; }
.topbar {
  position:sticky; top:0; z-index:100;
  background:var(--glass-nav);
  -webkit-backdrop-filter:var(--blur-nav); backdrop-filter:var(--blur-nav);
  box-shadow:inset 0 1px 0 var(--specular-top), inset 0 -1px 0 var(--specular-bottom),
    0 0 0 .5px var(--hairline), 0 8px 20px -4px rgba(var(--tint-ink),.06);
}
.topbar-inner { max-width:760px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; }
.back-btn {
  display:inline-flex; align-items:center; justify-content:center; flex:none;
  width:44px; height:44px; border-radius:14px; text-decoration:none; color:var(--primary);
  background:rgba(120,120,128,.12); cursor:pointer;
  box-shadow:inset 0 1px 0 var(--specular-top), 0 0 0 .5px var(--hairline-soft);
}
.brand { display:flex; flex-direction:column; text-decoration:none; color:var(--text); min-width:0; }
.brand b { font-size:15px; font-weight:800; letter-spacing:-.3px; }
.brand span { font-size:11px; color:var(--secondary); }
.card {
  background:var(--card); border-radius:var(--radius); padding:20px; margin-top:16px;
  box-shadow:inset 0 1px 0 var(--specular-top), inset 0 -1px 0 var(--specular-bottom),
    0 0 0 .5px var(--hairline), 0 8px 20px -6px rgba(var(--tint-ink),.08);
}
.sec-h { font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.sec-h .ico { width:28px; height:28px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; flex:none; }
.pill { display:inline-flex; align-items:center; padding:2px 10px; border-radius:9px; font-size:12.5px; font-weight:700; }
.pill.tS { background:var(--red-soft); color:var(--red); }
.pill.tA { background:var(--primary-soft); color:var(--primary); }
.pill.tB { background:var(--orange-soft); color:var(--orange); }
.pill.tOut { background:var(--sep); color:var(--gray-badge); text-decoration:line-through; }
/* 头卡 */
.hd { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.hd-ring { flex:none; width:88px; height:88px; }
.hd-name { font-size:24px; font-weight:800; letter-spacing:-.4px; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.hd-name .code { font-size:13px; font-weight:600; color:var(--secondary); font-variant-numeric:tabular-nums; }
.hd-sub { font-size:12.5px; color:var(--secondary); margin-top:4px; }
.kv { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px; }
.kv .k { background:rgba(255,255,255,.32); border-radius:12px; padding:10px 8px; text-align:center; }
.kv .k b { display:block; font-size:16px; font-variant-numeric:tabular-nums; }
.kv .k span { font-size:10.5px; color:var(--secondary); }
@media (max-width:480px){ .kv { grid-template-columns:repeat(2,1fr); } }
/* 直答 */
.live-box { border-radius:12px; background:var(--primary-soft); padding:12px 16px; font-size:13.5px; line-height:1.6; }
.live-box b { font-size:14.5px; }
.live-sub { display:block; font-size:11.5px; color:var(--secondary); margin-top:2px; }
.da-wait { color:var(--secondary); font-size:12.5px; }
/* 执行计划时间线 */
.step { display:flex; gap:12px; }
.step .s-l { flex:none; display:flex; flex-direction:column; align-items:center; }
.step .s-dot { width:26px; height:26px; border-radius:50%; background:var(--primary-soft); color:var(--primary);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex:none; }
.step .s-line { width:2px; flex:1; background:var(--sep); margin:4px 0; min-height:18px; }
.step:last-child .s-line { display:none; }
.step .s-b { padding-bottom:16px; min-width:0; }
.step .s-t { font-size:14.5px; font-weight:800; }
.step .s-t .when { font-size:11.5px; color:var(--primary); background:var(--primary-soft);
  border-radius:7px; padding:1px 8px; margin-left:7px; font-weight:700; }
.step .s-d { font-size:12.5px; color:var(--secondary); line-height:1.65; margin-top:3px; }
.step .s-d b { color:var(--text); }
/* 因子格 */
.fg { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
@media (max-width:480px){ .fg { grid-template-columns:repeat(2,1fr); } }
.f-cell { background:rgba(255,255,255,.32); border-radius:12px; padding:10px 6px; text-align:center; }
.f-cell .fv { font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; }
.f-cell .fv.good { color:var(--green); } .f-cell .fv.bad { color:var(--red); }
.f-cell .fl { font-size:11px; color:var(--secondary); margin-top:1px; }
.f-cell .fs { font-size:10px; color:var(--tertiary); }
/* 淘汰/降级条 */
.drop-bar { margin-top:12px; display:flex; align-items:flex-start; gap:8px;
  background:var(--red-soft); color:var(--red); border-radius:12px; padding:12px 16px;
  font-size:13px; font-weight:600; line-height:1.6; }
.down-bar { margin-top:12px; display:flex; align-items:flex-start; gap:8px;
  background:var(--orange-soft); color:var(--orange); border-radius:12px; padding:12px 16px;
  font-size:13px; font-weight:600; line-height:1.6; }
/* 回测矩阵 */
.mx-wrap { overflow-x:auto; }
.mx { width:100%; border-collapse:collapse; font-size:12px; margin-top:6px; }
.mx th, .mx td { padding:6px 8px; text-align:right; white-space:nowrap; }
.mx th { color:var(--secondary); font-weight:700; border-bottom:1px solid var(--sep); }
.mx td:first-child, .mx th:first-child { text-align:left; }
.mx tr.hl td { background:var(--primary-soft); font-weight:800; }
.mx .pos { color:var(--red); } .mx .neg { color:var(--green); } .mx .dead { color:var(--green); font-weight:800; }
.bt-note { font-size:11.5px; color:var(--tertiary); margin-top:8px; line-height:1.65; }
/* [v1.16.2] 公告红旗列表(只标不拦) */
.f-row { display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--sep); }
.f-row:last-child { border-bottom:none; }
.f-tag { flex:none; font-size:11px; font-weight:800; padding:3px 9px; border-radius:7px; white-space:nowrap; }
.f-tag.fr { background:var(--red-soft); color:var(--red); }
.f-tag.fo { background:var(--orange-soft); color:var(--orange); }
.f-tag.fg { background:rgba(120,120,128,.12); color:var(--secondary); }
.f-t { flex:1; min-width:0; font-size:13.5px; font-weight:600; line-height:1.5; }
.f-d { flex:none; font-size:11.5px; color:var(--tertiary); font-variant-numeric:tabular-nums; }
.f-link { flex:none; font-size:12px; font-weight:700; color:var(--primary); text-decoration:none; }
.f-ok { padding:14px 0; font-size:14px; color:var(--green); font-weight:700; }
/* 操作按钮 */
.btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:4px; }
.da-btn { border:none; cursor:pointer; font:700 13px -apple-system,"PingFang SC",sans-serif; color:var(--primary);
  background:var(--primary-soft); border-radius:12px; padding:12px 22px; min-height:44px;
  text-decoration:none; display:inline-flex; align-items:center; transition:transform .15s; }
.da-btn:active { transform:scale(.95); }
.da-btn.del { color:var(--red); background:var(--red-soft); }
.empty { text-align:center; padding:60px 20px; color:var(--secondary); font-size:14px; line-height:1.8; }
.foot { text-align:center; font-size:11px; color:var(--tertiary); margin-top:26px; line-height:1.7; }
</style>
</head>

<div class="topbar"><div class="topbar-inner">
  <a class="back-btn" href="index.html" aria-label="返回看板">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <a class="brand" href="index.html"><b>观澜擒龙 · 操作策略</b><span id="brandMeta">选股系统 v1.16</span></a>
</div></div>

<div class="page">
  <div id="app"><div class="empty">加载中…</div></div>
  <p class="foot">信号为历史规则回测输出，不构成投资建议 · 打板为高风险操作，单票仓位 2-3% · 总敞口 ≤10%<br>观澜擒龙 选股系统 · 数据由 15:10 盘后管道自动生成</p>
</div>

<script src="data.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const D = (typeof SITE_DATA !== 'undefined') ? SITE_DATA : null;
const DA_STORE_KEY = 'glql_daban_v115';                 // 与主站共享登记簿
const DA_Q = {};
const fp = v => (v == null || v === '') ? '—' : Number(v).toFixed(2);

/* ── 隔夜单资格矩阵(T+1收盘卖裸期望%, 两年4995股·24万样本·含0.15%双边成本) ── */
const OVN_MAT = {
  1: { row: '1板',  v: [+0.31, +0.29, -0.33, -0.20, -0.47, -1.59] },
  2: { row: '2板',  v: [+1.41, +0.32, -0.43, +0.07, -0.97, -2.67] },
  3: { row: '3板',  v: [+1.49, +1.33, -0.48, +0.60, -0.03, -2.35] },
  4: { row: '4板+', v: [+1.82, +0.37, +0.55, +0.75, -0.02, -2.56] },
};
const OVN_COLS = ['低开&gt;5%', '低开2~5%', '低开0~2%', '平开0~2%', '高开2~5%', '高开&gt;5%'];

/* ── 腾讯JSONP行情(与主站同源同法) ── */
function qtFetch(codes){
  return new Promise(resolve => {
    const mkt = c => /^[69]/.test(c) ? 'sh' : 'sz';
    const s = document.createElement('script');
    s.charset = 'GBK';
    let done = false;
    const fin = () => {
      if (done) return; done = true;
      const out = {};
      codes.forEach(c => {
        const v = window['v_' + mkt(c) + c];
        if (typeof v === 'string'){
          const f = v.split('~');
          if (f.length > 48) out[c] = { px:+f[3], pc:+f[4], po:+f[5], ph:+f[33], pl:+f[34], ztp:+f[47], ts:f[30] };
        }
      });
      s.remove(); resolve(out);
    };
    s.onload = fin; s.onerror = fin;
    setTimeout(fin, 8000);
    s.src = 'https://qt.gtimg.cn/q=' + codes.map(c => mkt(c) + c).join(',') + '&r=' + Date.now();
    document.head.appendChild(s);
  });
}
function daBJ(){ return new Date(Date.now() + 8 * 3600 * 1000); }
function daTodayStr(){ const d = daBJ(); return d.getUTCFullYear() + '-' + ('0'+(d.getUTCMonth()+1)).slice(-2) + '-' + ('0'+d.getUTCDate()).slice(-2); }
function daTradingBJ(){
  const d = daBJ(), wd = d.getUTCDay();
  if (wd === 0 || wd === 6) return false;
  const hm = d.getUTCHours() * 60 + d.getUTCMinutes();
  return hm >= 9*60 + 15 && hm < 15*60;
}
/* 盘中直答: 现在能不能买(与主站 daLiveCell 同口径)
   [v1.16.9] 隔夜单挂「昨收+5%」限价: 开盘≤+5%自动按开盘价成交(高开2-5%为正期望档·
   三梯队胜率73-82%), 开盘>+5%不成交·9:30撤单; 死亡区间(高开0-5%排队=涨停价成交·
   胜率33.1%)仅适用盘中排队打板, 未挂隔夜单者该档回封不追·已封板也不排;
   可排队仅: 低开/平开回封(成交~90%) 与 高开>5%已封板(≥7%约30%成交·一字基本排不到) */
function daLiveCell(code, q){
  if (!q) return '<span class="da-wait">非交易时段 · 交易日盘中自动判定</span>';
  const openRef = q.po > 0 ? q.po : q.px;
  const sealed = q.px >= q.ztp - 0.001;
  const nowGap = q.px / q.pc - 1;
  const lx = p => (q.pc * (1 + p)).toFixed(2);          /* [v1.16.4] 线位价 = 昨收×(1+pct) */
  const oTxt = q.po > 0 ? `开盘 ${q.po.toFixed(2)} · ` : '';
  const gap = openRef / q.pc - 1;
  const dead = gap > 0.001 && gap < 0.05;               /* 死亡区间: 高开0-5%(仅适用盘中排队打板) */
  const fill5 = gap <= 0.050001;                        /* [v1.16.9] 开盘≤+5% → 隔夜单已按开盘价成交 */
  if (sealed){
    if (fill5) return `<b style="color:var(--green);">✅ 已封板 ${q.px.toFixed(2)} · 隔夜单已按开盘价成交（开盘${(gap*100).toFixed(1)}% ≤ +5%限价 ${lx(0.05)}）· 继续持有</b>
      <span class="live-sub">按「封板续持 · 断板就走」执行${dead ? ' · 未挂隔夜单者不排：高开0-5%盘中排队=涨停价成交·该组胜率仅33.1%' : ' · 未挂隔夜单者可排队打板（低开/平开回封正期望·成交~90%）'}</span>`;
    const yizi = (q.pl || 0) >= q.ztp - 0.001;
    const fp = yizi ? '今日未开过板·基本排不到(排到=开板瞬间成交)'
      : (gap >= 0.07 ? '开盘≥7%·仅约30%能排到' : '');
    return `<b style="color:var(--orange);">⚠️ 已封板 ${q.px.toFixed(2)} · 开盘高开${(gap*100).toFixed(1)}% &gt; +5%限价 ${lx(0.05)} · 隔夜单未成交（9:30已撤）</b>
      <span class="live-sub">${fp ? fp + ' · ' : ''}排队打板非纪律（高开5-9%档胜率57-70%）· 要排挂 ${q.ztp.toFixed(2)} · 不排也完全OK</span>`;
  }
  if (!fill5) return `<b style="color:var(--red);">❌ 高开 ${(gap*100).toFixed(1)}%（${oTxt}&gt; +5%限价 ${lx(0.05)}）· 隔夜单未成交 · 9:30撤单 · 禁止追买</b>
    <span class="live-sub">高开&gt;5%为毒药档（5-9%胜率降至57-70%·≥9%仅42%且一字基本排不到）· 排板/半路都不做</span>`;
  if (dead) return `<b style="color:var(--primary);">✅ 开盘高开${(gap*100).toFixed(1)}%（${oTxt}≤ +5%限价）· 隔夜单已按开盘价成交 · 持有</b>
    <span class="live-sub">现价 ${q.px.toFixed(2)} · 高开2-5%为正期望档（三梯队胜率73-82%）· 断板按R3出场（开盘高开≥3%开盘卖/冲高+3%止盈/收盘卖）· 未挂隔夜单者半路不追·回封也不排（排队=涨停价成交·胜率33.1%）</span>`;
  return `<b style="color:var(--primary);">✅ 开盘${(gap*100).toFixed(1)}%（${oTxt}≤ +5%限价 ${lx(0.05)}）· 隔夜单已按开盘价成交 · 持有</b>
    <span class="live-sub">现价 ${q.px.toFixed(2)}（${nowGap>=0?'+':''}${(nowGap*100).toFixed(1)}%）· 等回封（触 ${q.ztp.toFixed(2)}）· 未挂隔夜单者可等回封排队打板（低开回封成交~90%）· 断板按R3出场</span>`;
}
async function daTick(){
  if (!daTradingBJ()) return;
  const code = CUR && CUR.code;
  if (!code) return;
  const q = await qtFetch([code]);
  const today = daTodayStr().replace(/-/g, '');
  if (q[code] && (!q[code].ts || !q[code].ts.startsWith(today))) delete q[code];
  Object.assign(DA_Q, q);
  const el = $('liveBox');
  if (el) el.innerHTML = daLiveCell(code, DA_Q[code]);
}
setInterval(daTick, 30000);

/* ── 登记簿(与主站共享) ── */
function daBook(){ try { return JSON.parse(localStorage.getItem(DA_STORE_KEY) || '[]'); } catch(e){ return []; } }
function daSave(b){ try { localStorage.setItem(DA_STORE_KEY, JSON.stringify(b)); } catch(e){} }
function daRegist(c){
  if (daBook().some(x => x.code === c.code)) return;
  const v = prompt(`登记「${c.name}」实际买入价（隔夜单按开盘价成交，默认按挂单价 ${c.cap5 || c.next_zt} 估，请改成实际成交价）：`, c.cap5 || c.next_zt);
  if (v === null) return;
  const buy = parseFloat(v) || c.cap5 || c.next_zt;
  const book = daBook();
  book.push({ code:c.code, name:c.name, lb:c.lb, next_zt:c.next_zt, buy, date: daTodayStr() });
  daSave(book);
  renderBtns();
}
function daRemove(code){
  daSave(daBook().filter(x => x.code !== code));
  renderBtns();
}
function renderBtns(){
  const el = $('btnRow');
  if (!el || !CUR) return;
  if (CUR.sel && CUR.sel.verdict === 'skip'){       // 淘汰标的不提供登记
    el.innerHTML = '<span style="font-size:12.5px;color:var(--secondary);">淘汰标的不提供买入登记 · 规则外的钱不赚</span>';
    return;
  }
  el.innerHTML = daBook().some(x => x.code === CUR.code)
    ? `<button class="da-btn del" onclick="daRemove('${CUR.code}')">移除登记</button>`
    : `<button class="da-btn" onclick="daRegist(CUR)">已买入 · 登记（次日提示持有/止盈/离场）</button>`;
}

/* ── 渲染 ── */
let CUR = null;
function ringHTML(size, stroke, ratio, color, inner){
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(120,120,128,.14)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${(c * Math.max(0, Math.min(1, ratio))).toFixed(1)} ${c.toFixed(1)}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <foreignObject width="${size}" height="${size}"><div xmlns="http://www.w3.org/1999/xhtml"
      style="width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;">${inner}</div></foreignObject>
  </svg>`;
}
function findCand(code){
  return [...(D.candidates_4plus||[]), ...(D.candidates_2to3||[]), ...(D.candidates_3to4||[]), ...(D.candidates_1to2||[])]
    .find(x => x.code === code);
}
/* ── [v1.16.2] 公告红旗核查: 东财公告接口 · 近7日分级列表 · 只标不拦 ── */
const FLAG_RE_HARD = /(停牌核查|严重异常|立案|行政处罚|警示函|监管函|问询函|终止上市)/;
const FLAG_RE_CUT  = /(减持计划|拟减持|权益变动触及)/;
const FLAG_RE_ROUT = /(异常波动|风险提示)/;
async function flagLoad(code){
  const box = $('flagBox');
  if (!box) return;
  try {
    const r = await fetch('https://np-anotice-stock.eastmoney.com/api/security/ann?sr=-1&page_size=50&page_index=1&ann_type=A&client_source=web&stock_list=' + code, { cache: 'no-store' });
    const j = await r.json();
    const list = (j && j.data && j.data.list) || [];
    const cut = Date.now() - 7 * 864e5, rows = [];
    list.forEach(x => {
      const t = x.title || '', time = (x.display_time || '').slice(0, 10);
      const ts = new Date(time.replace(/-/g, '/')).getTime();
      if (!t || !time || isNaN(ts) || ts < cut) return;
      let cls = null, lab = '';
      if (FLAG_RE_HARD.test(t)) { cls = 'fr'; lab = '🚨 硬红旗'; }
      else if (FLAG_RE_CUT.test(t)) { cls = 'fo'; lab = '⚠️ 减持'; }
      else if (FLAG_RE_ROUT.test(t)) { cls = 'fg'; lab = '📋 常规'; }
      if (cls) rows.push({ t, time, cls, lab, art: x.art_code || '' });
    });
    if (!rows.length){ box.innerHTML = '<div class="f-ok">✅ 近7日无红旗公告</div>'; return; }
    box.innerHTML = rows.map(x => `
      <div class="f-row">
        <span class="f-tag ${x.cls}">${x.lab}</span>
        <span class="f-t">${x.t}</span>
        <span class="f-d">${x.time}</span>
        ${x.art ? `<a class="f-link" href="https://data.eastmoney.com/notices/detail/${code}/${x.art}.html" target="_blank" rel="noopener">原文 →</a>` : ''}
      </div>`).join('');
  } catch(e){
    box.innerHTML = '<div style="padding:12px 0;" class="da-wait">公告接口暂不可用（只标不拦，不影响判定）</div>';
  }
}

  const flagCard = `

    <div id="flagBox"><span class="da-wait">公告核查中…</span></div>
    <p class="bt-note">数据源: 东方财富公告接口(页面打开时实时拉取, 晚间新披露也会显示)。分级: 🚨 硬红旗(停牌核查/立案/处罚/问询 — 下单前务必读原文) · ⚠️ 减持(连板期间新减持计划 = 真实卖压) · 📋 常规披露(异动公告 = 连板必发的合规自查, 非增量利空)。<b>只标不拦</b> — 公告不改变任何交易判定, 与「高度定梯队+分数排雷」的回测口径保持一致。</p>

  /* 四步执行计划 */
  const steps = skip ? [

    { t: '明早开盘确认', when: '9:30', d: `<b>不用盯 9:15-9:20 竞价</b>。9:25 撮合定格即开盘价：<b>开盘价 ≤ ${fp(pPct(0.05))} → 隔夜单自动按开盘价成交，什么都不用做</b>；开盘价 &gt; ${fp(pPct(0.05))}（高开&gt;5%）→ 不成交，<b>9:30 看一眼撤单即可</b>（撤了也不追）。+5% 限价自动屏蔽毒药档：高开 5-9% 胜率降至 57-70%、≥9% 仅 42% 且一字基本排不到。` },

  const factors = [
    { l:'换手率', v: fNA ? '—' : (c.turn ?? 0).toFixed(2) + '%', s: fNA ? '' : (SP.turn ?? 0).toFixed(1) + '/20', good: !fNA && c.turn < 10, bad: !fNA && c.turn >= 20 },
    { l:'封单', v: fNA ? '—' : (c.seal ?? 0).toFixed(2) + '亿', s: fNA ? '' : (SP.seal ?? 0).toFixed(1) + '/15', good: !fNA && c.seal >= 1.5, bad: !fNA && c.seal < 0.4 },

      回测证据 · ${sel.label || ''}</div>
    <div class="kv" style="grid-template-columns:repeat(3,1fr);">
      <div class="k"><b style="color:${color};">${sel.win || '—'}</b><span>两年胜率(R3口径)</span></div>
      <div class="k"><b>${sel.avg || '—'}</b><span>单笔均值</span></div>
      <div class="k"><b style="font-size:12.5px;">${sel.recent || '—'}</b><span>近期表现</span></div>

  </div>`;

  /* 按钮区 */
  const btnCard = `
  <div class="card">
    <div class="btns" id="btnRow"></div>
    <p class="bt-note" style="text-align:center;">登记后主站「我的打板仓」每天盘中自动提示 持有 / 止盈 / 离场</p>
  </div>`;

  $('app').innerHTML = headCard + liveCard + flagCard + planCard + factorCard + btCard + btnCard;
  renderBtns();
  daTick();
  flagLoad(code);                       /* [v1.16.2] 公告红旗核查 */
}
render();
